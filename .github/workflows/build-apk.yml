name: Build File APK Android (NiagaAngkut)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36 & Terima Lisensi
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager tidak ditemukan di $SDK_DIR/cmdline-tools"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web app
        run: npm run build

      - name: Generate Android project & sync Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > android/local.properties

      - name: Build APK Debug
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan file NiagaAngkut.apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: File APK tidak ditemukan di $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" NiagaAngkut.apk
          ls -lh NiagaAngkut.apk

      - name: Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NiagaAngkut-APK
          path: NiagaAngkut.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish NiagaAngkut.apk ke GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk NiagaAngkut.apk --clobber
          else
            gh release create latest-apk NiagaAngkut.apk \
              --title "NiagaAngkut Android APK" \
              --notes "Tap file NiagaAngkut.apk di bawah ini untuk langsung download dan install di HP Android."
          fi
